name: Yemekhane Akşam Bildirimi

on:
  schedule:
    # Pazar - Perşembe TSİ 18:30 (UTC 15:30)
    - cron: '30 15 * * 0-4'
  workflow_dispatch:

jobs:
  aksam-menu:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Istanbul'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Yarının Menüsünü Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py yarin
