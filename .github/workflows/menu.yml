name: SBTU Yemekhane Bildirimi

on:
  schedule:
    # Pazartesi - Cuma arası UTC 05:30 (TR saati 08:30)
    - cron: '30 5 * * 1-5'
    # Pazar - Perşembe arası UTC 15:30 (TR saati 18:30)
    - cron: '30 15 * * 0-4'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Menüyü Çek ve Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 12 ]; then
            python main.py bugun
          else
            python main.py yarin
          fi
