name: Yemekhane Sabah Bildirimi

on:
  schedule:
    # Pazartesi - Cuma TSİ 08:30 (UTC 05:30)
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

jobs:
  sabah-menu:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Istanbul'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Bugünün Menüsünü Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py bugun
